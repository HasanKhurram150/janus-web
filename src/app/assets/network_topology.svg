<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Header Bar -->
  <g id="top-header">
    <rect x="0" y="0" width="1200" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="32" y="38" font-size="20" font-weight="700" fill="#0F172A">Network Topology Maps</text>
    <text x="32" y="56" font-size="12" fill="#64748B">Visualize your network — right-click a device to inspect telemetry or modify icon sets</text>

    <!-- Header Action Buttons -->
    <rect x="740" y="20" width="105" height="30" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="755" y="39" font-size="11" font-weight="600" fill="#2563EB">Manage Devices</text>

    <rect x="855" y="20" width="95" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="872" y="39" font-size="11" font-weight="500" fill="#475569">Icon Manager</text>

    <rect x="960" y="20" width="100" height="30" rx="4" fill="#2563EB"/>
    <text x="975" y="39" font-size="11" font-weight="600" fill="#FFFFFF">Maximize Map</text>

    <rect x="1070" y="20" width="95" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="1088" y="39" font-size="11" font-weight="500" fill="#475569">Export SVG</text>
  </g>

  <!-- Controls & Filters Bar -->
  <g id="controls-bar">
    <text x="32" y="102" font-size="12" font-weight="700" fill="#334155">Select Map:</text>
    <rect x="32" y="114" width="140" height="26" rx="4" fill="#2563EB"/>
    <text x="44" y="131" font-size="11" font-weight="600" fill="#FFFFFF">Enterprise Core DC-01</text>
    <rect x="1085" y="114" width="80" height="26" rx="4" fill="#10B981"/>
    <text x="1102" y="131" font-size="11" font-weight="600" fill="#FFFFFF">+ New Map</text>

    <text x="32" y="156" font-size="11" fill="#64748B">Viewing: Enterprise Core DC-01 • Visible Nodes: 18/18</text>

    <!-- Filter Checkboxes -->
    <text x="32" y="185" font-size="11" font-weight="700" fill="#475569">Filter Devices:</text>
    <text x="120" y="185" font-size="11" fill="#2563EB">☑ Firewall</text>
    <text x="195" y="185" font-size="11" fill="#2563EB">☑ Switch</text>
    <text x="260" y="185" font-size="11" fill="#2563EB">☑ Router</text>
    <text x="325" y="185" font-size="11" fill="#2563EB">☑ Server</text>
    <text x="390" y="185" font-size="11" fill="#2563EB">☑ Wireless</text>
    <text x="465" y="185" font-size="11" fill="#2563EB">☑ Storage</text>

    <line x1="32" y1="200" x2="1165" y2="200" stroke="#F1F5F9" stroke-width="1.5"/>
    <text x="32" y="218" font-size="10" fill="#94A3B8">Live Polling: 11:52:14 AM • 0 dropped packets</text>
  </g>

  <!-- Topology Canvas & Connection Links -->
  <g id="topology-links" stroke="#10B981" stroke-width="2" stroke-dasharray="3,3">
    <!-- WAN to Gateway -->
    <line x1="430" y1="280" x2="520" y2="360" stroke="#0284C7" stroke-width="2.5"/>
    <line x1="610" y1="280" x2="520" y2="360" stroke="#0284C7" stroke-width="2.5"/>

    <!-- Gateway to Servers & Switches -->
    <line x1="520" y1="360" x2="350" y2="360" stroke="#10B981" stroke-width="2"/>
    <line x1="520" y1="360" x2="690" y2="360" stroke="#10B981" stroke-width="2"/>
    <line x1="520" y1="360" x2="430" y2="480" stroke="#10B981" stroke-width="2.5"/>
    <line x1="520" y1="360" x2="610" y2="480" stroke="#10B981" stroke-width="2.5"/>

    <!-- Inter-Switch Trunk Link -->
    <line x1="430" y1="480" x2="610" y2="480" stroke="#059669" stroke-width="3" stroke-dasharray="none"/>

    <!-- Switches to Access Points -->
    <line x1="430" y1="480" x2="330" y2="600" stroke="#10B981" stroke-width="1.5"/>
    <line x1="430" y1="480" x2="430" y2="600" stroke="#10B981" stroke-width="1.5"/>
    <line x1="610" y1="480" x2="610" y2="600" stroke="#10B981" stroke-width="1.5"/>
    <line x1="610" y1="480" x2="710" y2="600" stroke="#10B981" stroke-width="1.5"/>
    
    <!-- Secondary Branch Link -->
    <line x1="880" y1="360" x2="880" y2="480" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <!-- Topology Node Items -->
  <g id="nodes" text-anchor="middle">
    <!-- WAN Uplink 1 -->
    <circle cx="430" cy="270" r="22" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="430" y="275" font-size="14" font-weight="700" fill="#0284C7">⇋</text>
    <text x="430" y="306" font-size="11" font-weight="700" fill="#1E293B">WAN-UPLINK-01</text>
    <text x="430" y="320" font-size="9" fill="#0284C7">10 Gbps Tier-1</text>

    <!-- WAN Uplink 2 -->
    <circle cx="610" cy="270" r="22" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="610" y="275" font-size="14" font-weight="700" fill="#0284C7">⇋</text>
    <text x="610" y="306" font-size="11" font-weight="700" fill="#1E293B">WAN-BACKUP-02</text>
    <text x="610" y="320" font-size="9" fill="#0284C7">1 Gbps Failover</text>

    <!-- Core Edge Firewall -->
    <rect x="495" y="335" width="50" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="520" y="365" font-size="18" fill="#D97706">🛡</text>
    <text x="520" y="405" font-size="11" font-weight="800" fill="#0F172A">EDGE-FW01-HA</text>
    <rect x="480" y="413" width="80" height="16" rx="3" fill="#334155"/>
    <text x="520" y="425" font-size="9" font-weight="600" fill="#FFFFFF">ACTIVE CLUSTER</text>

    <!-- Dedicated Database Server -->
    <rect x="325" y="335" width="50" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="350" y="365" font-size="18" fill="#2563EB">▤</text>
    <text x="350" y="405" font-size="11" font-weight="700" fill="#1E293B">DB-INGEST-01</text>
    <text x="350" y="420" font-size="9" fill="#10B981">● 99.99% SLA</text>

    <!-- SIEM App Server -->
    <rect x="665" y="335" width="50" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="690" y="365" font-size="18" fill="#2563EB">▤</text>
    <text x="690" y="405" font-size="11" font-weight="700" fill="#1E293B">SIEM-CORE-APP</text>
    <text x="690" y="420" font-size="9" fill="#10B981">● 14.2k eps</text>

    <!-- Core Switch 01 -->
    <rect x="405" y="455" width="50" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="430" y="485" font-size="18" fill="#059669">☷</text>
    <text x="430" y="525" font-size="11" font-weight="700" fill="#1E293B">DIST-SW01</text>
    <rect x="400" y="532" width="60" height="15" rx="3" fill="#059669"/>
    <text x="430" y="543" font-size="9" font-weight="600" fill="#FFFFFF">PoE+ 48P</text>

    <!-- Core Switch 02 -->
    <rect x="585" y="455" width="50" height="50" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="610" y="485" font-size="18" fill="#059669">☷</text>
    <text x="610" y="525" font-size="11" font-weight="700" fill="#1E293B">DIST-SW02</text>
    <rect x="580" y="532" width="60" height="15" rx="3" fill="#059669"/>
    <text x="610" y="543" font-size="9" font-weight="600" fill="#FFFFFF">PoE+ 48P</text>

    <!-- Wireless APs (Leaf Nodes) -->
    <g id="access-points">
      <circle cx="330" cy="595" r="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="330" y="600" font-size="12" fill="#10B981">📶</text>
      <text x="330" y="630" font-size="10" font-weight="600" fill="#1E293B">AP-FLOOR-01</text>

      <circle cx="430" cy="595" r="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="430" y="600" font-size="12" fill="#10B981">📶</text>
      <text x="430" y="630" font-size="10" font-weight="600" fill="#1E293B">AP-FLOOR-02</text>

      <circle cx="610" cy="595" r="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="610" y="600" font-size="12" fill="#10B981">📶</text>
      <text x="610" y="630" font-size="10" font-weight="600" fill="#1E293B">AP-CORP-01</text>

      <circle cx="710" cy="595" r="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="710" y="600" font-size="12" fill="#10B981">📶</text>
      <text x="710" y="630" font-size="10" font-weight="600" fill="#1E293B">AP-GUEST-02</text>
    </g>

    <!-- Isolated Remote Branch -->
    <rect x="855" y="335" width="50" height="50" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="880" y="365" font-size="18" fill="#D97706">🛡</text>
    <text x="880" y="405" font-size="11" font-weight="700" fill="#1E293B">BRANCH-FW-02</text>
    <text x="880" y="420" font-size="9" fill="#0284C7">IPsec Mesh</text>

    <rect x="855" y="455" width="50" height="50" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="880" y="485" font-size="18" fill="#64748B">☷</text>
    <text x="880" y="525" font-size="11" font-weight="600" fill="#64748B">EDGE-SW-08</text>
    <text x="880" y="540" font-size="9" fill="#10B981">Standby</text>
  </g>
</svg>
